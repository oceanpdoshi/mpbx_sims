[project]
name = "mpbx-sims"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "meepjax",
    "mpbjax",
]

[tool.uv.sources]
mpbjax = { path = "../mpbx/python", editable = true }
meepjax = { path = "../mpbx/python/meepjax", editable = true }

[dependency-groups]
dev = [
    "griffe>=1.3",
    "ipykernel>=6",
    "jupyter-client>=8",
    "matplotlib>=3.7",
    "nbclient>=0.9",
    "nbformat>=5",
]
